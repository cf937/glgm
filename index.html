{title:'便当',text:'午休。杜新宇打开一个三层的漆器便当盒，里面码着精致的玉子烧和照烧鰆鱼。而你的桌上，只有一个便利店的饭团。',options:[

 {t:'偷偷拍下照片发到班级群',d:-9,s:'“删掉。”她说。\n\n声音很轻，但你能听出她在抖。'},
 {t:'“你穿这个好丑。”',d:-6,s:'“……我知道。”她说，“反正也是被逼的。”'},
 {t:'自己跑去玩，让她一个人守摊位',d:-5,s:'你玩到傍晚才回来。\n\n摊位前只有她一个人，喉咙已经哑了。'},
 {t:'把她准备的点心全吃光了',d:-7,s:'“那是……我昨晚做的。”\n\n她把盘子放下，转身去招待客人了。'}
]},
{title:'考试',text:'期中考试成绩公布，杜新宇的数学意外地只考了六十二分。她盯着卷子，抿着嘴唇一言不发。',options:[
 {t:'“要不要我帮你补数学？”',d:5,c:2,s:'“……你会吗？”\n\n“试试看。”\n\n从那天起，每周三放学后，你们都会留在教室里。'},
 {t:'考完试递给她一颗糖',d:4,s:'她把糖捏在手里，没有拆。\n\n“我不吃甜的。”'},
 {t:'“哈哈，你不是年级第一吗？”',d:-6,s:'“是啊。”她说，“我很差劲。”'},
 {t:'偷偷看她的卷子抄答案',d:-7,s:'她察觉到了，把卷子往自己那边拉了拉。'},
 {t:'“有钱人还用得着考试吗？”',d:-5,s:'“考不好，就要被送去联姻。”她说，“所以我必须考好。”'},
 {t:'把她忘在桌上的笔袋藏起来',d:-6,s:'放学后她翻了半天，最后在你的抽屉里找到了。'}
]},
{title:'生病',text:'杜新宇发烧请假了。班级群里没人提起这件事，她的座位空了一整天。',options:[
 {t:'放学后去她家送作业和一碗热粥',d:8,c:3,s:'“你怎么来了。”\n\n“送作业。”你把粥举起来，“还有这个。”\n\n她愣了很久，才侧身让你进去。'},
 {t:'发条消息问候一句',d:3,s:'你发了句“好点了吗”。\n\n她隔了两个小时才回：“嗯。”'},
 {t:'在群里说她肯定是装病',d:-8,s:'第二天她来上学了，脸色还是很白。'},
 {t:'什么也没做',d:-2,s:'第二天她的座位上还是空的。'},
 {t:'“大小姐也会生病？真是稀奇。”',d:-5,s:'她把手机扣在了床上。'},
 {t:'借机翻她的课桌抽屉',d:-9,s:'“你在干什么。”\n\n她站在教室门口，声音冷得像冰。'}
]},
{title:'生日',text:'你从班里的通讯录上发现，今天是杜新宇的生日。而她的桌上，一份礼物也没有。',options:[
 {t:'放学后跑遍半座城，亲手做了一份礼物',d:8,c:3,s:'她把那个歪歪扭扭的手工摆件抱在怀里，低着头，肩膀轻轻地抖了一下。'},
 {t:'其实早就记下了日期，送了她提过的那本书',d:6,c:3,s:'“你上次在图书馆盯着它看了十分钟。”\n\n“……你居然记得。”'},
 {t:'完全忘了，事后才随口补一句“生日快乐”',d:-5,s:'“……谢谢。”\n\n她把书包背好，一个人走了。'},
 {t:'当众说“大小姐肯定看不上我的礼物”',d:-6,s:'全班都笑了。\n\n她也笑了，笑得很好看。'},
 {t:'把她自己买的小蛋糕吃掉了',d:-8,s:'“那是……我自己买的。”\n\n她说完就转过身去了。'},
 {t:'送了她最讨厌的百合花',d:-4,s:'“我不喜欢百合。”她说。\n\n你后来才知道，她母亲葬礼上的花，就是百合。'}
]},
{title:'偶遇',text:'周末的商业街，你在一家橱窗前看到了杜新宇。她一个人，手里拎着几个纸袋，神情有些落寞。',options:[
 {t:'自然地打招呼，陪她逛了一会儿',d:5,c:2,s:'“要不要一起？”\n\n她点了点头。那天下午，你们走了三条街。'},
 {t:'上前帮她拎东西',d:4,s:'“……我自己拿得动。”\n\n但她没有抢回去。'},
 {t:'偷拍她试衣服的照片发到朋友圈',d:-9,s:'她把奶茶放下，转身走了。'},
 {t:'“你一个人逛街？没朋友吗？”',d:-6,s:'“嗯，没朋友。”\n\n她说完就往反方向走了。'},
 {t:'假装没看见，绕开走',d:-4,s:'走了几步，你回头看了一眼——她还站在那里，看着橱窗。'},
 {t:'不小心把她的购物袋撞翻，还嫌她挡路',d:-7,s:'她捡完东西站起来，看了你一眼，走了。'}
]},
{title:'家庭',text:'杜新宇今天一整天都心不在焉。放学后她坐在教室最后一排没走。你走过去，听见她低声说：\n“……家里让我去见一个相亲对象。”',options:[
 {t:'安静地坐在旁边，听她说完',d:7,c:2,s:'她说了很久。\n\n说完之后，她长出了一口气。\n\n“……谢谢你听我说这些。”'},
 {t:'“不想去就不去，我陪你。”',d:6,c:3,s:'她愣了一下。\n\n“你陪我？”\n\n“嗯。”\n\n她笑了，那是你第一次看见她笑得那么轻。'},
 {t:'“这不是好事吗，豪门联姻。”',d:-7,s:'“是啊。”她说，“挺好的。”'},
 {t:'第二天到处跟人说她要去相亲了',d:-8,s:'她坐在座位上，一整节课都在看窗外。'},
 {t:'“关我什么事。”',d:-5,s:'“也是。”她说，“跟你没关系。”'},
 {t:'嘲笑她被家里管得死死的',d:-6,s:'她沉默了很久。\n\n“嗯，我什么都要听。”'}
]},
{title:'咖啡厅',text:'放学路上你们一起进了车站旁的一家咖啡厅。杜新宇盯着菜单看了很久。',options:[
 {t:'记住她上次点的口味，替她点好了',d:6,c:3,s:'“老样子，热的，少糖。”你对店员说。\n\n“你什么时候记住的？”\n\n“上次。”'},
 {t:'安静地陪她坐着，什么也不说',d:4,s:'最后她轻声说了一句：“……这样挺好的。”'},
 {t:'把咖啡洒在她的裙子上，还笑',d:-7,s:'“……没事。”她说。\n\n但她的声音一点都不像没事。'},
 {t:'“你喝这么贵的东西不心疼？”',d:-5,s:'“那我请你。”她说，“我有钱。”'},
 {t:'全程低头玩手机',d:-4,s:'她喝完了整杯咖啡，你才抬起头。'},
 {t:'把她的甜点端过来吃了',d:-6,s:'“……那是我的。”\n\n她把叉子放下，去前台又点了一份。'}
]},
{title:'游乐园',text:'班级活动去游乐园。杜新宇站在过山车下面，脸色发白，却嘴硬地说：“我、我当然不怕。”',options:[
 {t:'“那我陪你坐。”',d:6,c:2,s:'俯冲下来的一瞬间，她死死抓住了你的手。\n\n下车之后，她松开手，假装什么都没有发生。'},
 {t:'进鬼屋时悄悄牵住她的手',d:7,c:4,s:'黑暗里，你摸到了她的手。\n\n她抖了一下，但没抽开。'},
 {t:'故意在鬼屋里把她推到前面',d:-8,s:'她尖叫着往前扑了一下，撞到了墙角的道具。'},
 {t:'让她一个人排队，自己跑去玩别的',d:-5,s:'“你怎么才回来。”\n\n她的声音有点哑。'},
 {t:'嘲笑她被鬼屋吓哭了',d:-7,s:'“你笑什么。”\n\n她擦了一把脸，转身走了。'},
 {t:'把她买的棉花糖碰掉在地上',d:-4,s:'她蹲下去看了一眼，没有捡。'}
]},
{title:'烟花',text:'夏日烟花大会，人潮汹涌。杜新宇穿着浴衣站在人群边缘，被推得踉跄了一下。',options:[
 {t:'伸手把她护在身前',d:6,c:3,s:'她僵了一下，然后慢慢放松下来。\n\n烟花在头顶炸开，她的眼睛映着光。'},
 {t:'提前半小时就替她占好了位置',d:5,c:2,s:'“……你等了多久？”\n\n“没多久。”'},
 {t:'全程只顾着拍照发动态',d:-4,s:'你翻了翻相册，才发现没有一张是完整的。'},
 {t:'挤到她前面挡住视线',d:-5,s:'“算了。”她说，转身走了。'},
 {t:'“烟花有什么好看的，幼稚。”',d:-6,s:'她一个人看完了整场烟花。'},
 {t:'把她一个人丢在人群里自己走了',d:-8,s:'她一个人站在人群里，手里还拿着那支没吃几口的苹果糖。'}
]},
{title:'圣诞',text:'平安夜。教室里挂满了装饰，杜新宇的桌上放着一个包装精致的盒子，但她一整天都没有送出去。',options:[
 {t:'放学时主动叫住她，收下了那份礼物',d:7,c:3,s:'她一直等到教室里的人都走光了。\n\n你接过来，说：“谢谢。”\n\n她长长地松了一口气。'},
 {t:'陪她去教堂前许了个愿',d:5,c:2,s:'“……不许问。”'},
 {t:'“圣诞礼物呢？大小姐肯定很有钱吧。”',d:-6,s:'“没有。”她说，“我没有准备。”'},
 {t:'忘了这天，和朋友出去玩了',d:-5,s:'第二天早上，她桌上的盒子还在。'},
 {t:'当面拆开礼物，嫌弃地说了句“就这？”',d:-7,s:'“……我织了一个月。”她说。'},
 {t:'喝醉了让她送你回家',d:-3,s:'她扶着你走了两公里。'}
]},
{title:'初诣',text:'新年第一天，你们在神社门口碰巧遇见。杜新宇穿着白色的大衣，手里握着一支签。',options:[
 {t:'和她一起抽签，抽到大吉时一起笑了',d:5,c:2,s:'“那……分你一半。”\n\n她把签文撕成了两半。'},
 {t:'把自己的护身符解下来给她',d:6,c:3,s:'她捏着那个护身符，很久都没有说话。'},
 {t:'把她的签文念给所有人听',d:-5,s:'她站在原地，把那张签文收进了口袋里。'},
 {t:'“你许的什么愿？肯定很自私吧。”',d:-6,s:'“算了，不说了。”'},
 {t:'迟到整整一个小时',d:-4,s:'你到的时候，她的鼻尖已经冻红了。'},
 {t:'全程抱怨人多天冷',d:-3,s:'她走在前面，没有说话。'}
]},
{title:'情人节',text:'二月十四日。杜新宇在你桌肚里放了一个小盒子，然后一整天都没敢看你的方向。',options:[
 {t:'打开盒子，认真地对她道谢',d:7,c:4,s:'“第一次做……”她说。\n\n“很好吃。”你说。\n\n她抬起眼睛，笑了一下。'},
 {t:'第二天回赠了一份亲手做的点心',d:6,c:3,s:'她捧着那个盒子，很久没有打开。'},
 {t:'“这是义理巧克力吧？”',d:-5,s:'“……嗯，义理。”\n\n她把盒子往你那边推了推。'},
 {t:'当着她的面把巧克力分给了别人',d:-9,s:'她看着，笑着，什么也没说。'},
 {t:'嫌弃地说“太甜了”',d:-6,s:'“下次少放糖。”\n\n她把剩下的巧克力拿走了。'},
 {t:'什么也没回应，隔了三天才提起',d:-4,s:'“我忘了。”'}
]},
{title:'修学旅行',text:'修学旅行，你和杜新宇被分到了同一间和室。她抱着枕头坐在角落，耳朵红得厉害。',options:[
 {t:'礼貌地保持距离，主动睡在靠门的一侧',d:5,c:2,s:'半夜醒来，你发现她把自己的被子分了一半，盖在你身上。'},
 {t:'晚上陪她去露台看星星',d:7,c:4,s:'“小时候，没人陪我，我就看星星。”\n\n你侧过头，看见她的侧脸。'},
 {t:'半夜偷拍她睡觉的样子',d:-9,s:'“删掉。”\n\n她的声音很平静。'},
 {t:'把她的行李藏起来',d:-6,s:'她找了半个小时。'},
 {t:'和别的女生出去玩，把她晾在房间',d:-6,s:'“回来了。”她说。'},
 {t:'把她的洗漱用品全用完了',d:-4,s:'“那我用什么。”'}
]},
{title:'毕业',text:'毕业典礼结束。操场上到处都是合影的人。杜新宇站在樱花树下，手里捏着第二颗纽扣，迟迟没有走过来。',options:[
 {t:'主动走过去，把想说的话全部说了出来',d:8,c:5,s:'她听完，低下头，把纽扣塞进你手里。\n\n“……笨蛋。”'},
 {t:'先一步把制服上的第二颗纽扣扯下来递给她',d:7,c:4,s:'“……我等了三年。”她说。'},
 {t:'全程和别人合影，一眼都没看她',d:-5,s:'她站在樱花树下等了一个小时，最后一个人走了。'},
 {t:'“毕业了，以后也不用见面了。”',d:-8,s:'“……嗯。”她说，“再见。”'},
 {t:'把她的毕业纪念册弄丢了',d:-5,s:'“这是我的。”她说。'},
 {t:'在典礼上睡着了',d:-3,s:'你醒的时候，她的座位是空的。'}
]},
{title:'换座位',text:'班主任宣布要重新排座位。杜新宇听到消息的时候，手里的笔顿了一下。\n\n她侧过头，很轻很轻地看了你一眼。',options:[
 {t:'“老师，我想和她坐一起。”',d:6,c:3,s:'全班都安静了。\n\n杜新宇的脸一下子红了。\n\n“……你、你乱说什么。”'},
 {t:'提前把自己的书包放在她旁边的位置上',d:5,c:2,s:'“这个位子有人了。”\n\n她看着你，眨了眨眼睛。\n\n“……幼稚。”'},
 {t:'“随便坐哪都行。”',d:1,s:'她被排到了另一个座位。'},
 {t:'“终于可以不用和你坐了。”',d:-5,s:'她搬桌子的时候，动作很快。'},
 {t:'趁她不注意把她的姓名牌藏了起来',d:-6,s:'她找了很久。\n\n最后在你的桌肚里找到了。'},
 {t:'提前去教室占好她旁边的位置',d:4,c:2,s:'“你怎么来这么早。”\n\n“占位置。”'}
]},
{title:'社团',text:'社团招新。杜新宇站在文学社的摊位前，手里捏着一张报名表，迟迟没有动笔。',options:[
 {t:'“要不我们一起报文学社？”',d:5,c:3,s:'“……你也喜欢文学？”\n\n“我喜欢和你一起。”'},
 {t:'陪她一起排队报名',d:4,c:2,s:'她站在你前面，安静地翻着报名表。'},
 {t:'“文学社？多无聊啊。”',d:-5,s:'她把报名表折起来，塞回了口袋。'},
 {t:'自己跑去报了别的社团',d:-4,s:'她一个人站在文学社的摊位前，填完了表。'},
 {t:'拉她去报了动漫社',d:-3,s:'她站在一群二次元中间，一脸茫然。'},
 {t:'“你确定你能坚持下来？”',d:-5,s:'“不确定。”她说，“但我可以试。”'}
]},
{title:'笔记',text:'你因为请假落下了三天的课。回到教室的时候，桌上放着一本笔记本。\n\n字迹很工整，每一页都标了日期。',options:[
 {t:'翻开第一页，发现是杜新宇的字',d:7,c:3,s:'你抬头看她。\n\n她正低头写作业，耳朵却红了。\n\n“……我顺便抄的。”'},
 {t:'“谢谢你，笔记借我抄一下。”',d:5,s:'“嗯。”她说，“别弄脏了。”'},
 {t:'把笔记本放进书包，什么都没说',d:2,s:'她抬起头看了你一眼，又低下了。'},
 {t:'“这是谁放的？没人认领我扔了。”',d:-7,s:'她握着笔的手紧了紧。\n\n“……是我放的。”'},
 {t:'在笔记本上乱涂乱画',d:-9,s:'第二天，她把笔记本收了回去。'},
 {t:'把笔记本转借给了别人',d:-6,s:'她知道之后，很久都没有说话。'}
]},
{title:'电话号码',text:'班群里发了一份通讯录。\n\n你翻到杜新宇那一页，发现她的手机号后面，有人用铅笔轻轻写了一个“可”。',options:[
 {t:'当天晚上就发了条消息过去',d:6,c:3,s:'她隔了半个小时才回。\n\n“你怎么有我的号码。”\n\n“通讯录。”\n\n又隔了十分钟。\n\n“……晚安。”'},
 {t:'把号码存进手机，备注是“同桌”',d:4,c:2,s:'第二天她问你：“你存我号码了？”\n\n“嗯。”\n\n“备注是什么。”\n\n“同桌。”'},
 {t:'把号码发给了别人',d:-8,s:'第二天她收到了一堆陌生短信。'},
 {t:'“谁稀罕她的号码。”',d:-5,s:'这话传到了她耳朵里。'},
 {t:'把通讯录上那一页撕了下来',d:-6,s:'她翻了半天，最后发现那一页不见了。'},
 {t:'装作没看见',d:0,s:'那一页后来被谁擦掉了，谁也不知道。'}
]},
{title:'运动会',text:'校运会。杜新宇被班里报了三千米。\n\n她站在起跑线上，脸色发白，手指紧紧攥着号码布。',options:[
 {t:'全程陪跑，在跑道边给她递水',d:7,c:3,s:'最后一圈的时候，她的腿已经在抖了。\n\n“还有一圈！”你喊。\n\n她看了你一眼，咬着牙冲过了终点。\n\n然后直接倒在了你怀里。'},
 {t:'提前准备好毛巾和温水',d:5,c:2,s:'她冲过终点，接过你手里的毛巾，愣了一下。\n\n“……你什么时候准备的。”'},
 {t:'站在终点线旁边，举着她的名字',d:4,c:2,s:'她远远看见了那块牌子，脚步快了一点。'},
 {t:'“跑不动就别跑了。”',d:-5,s:'她瞪了你一眼，继续往前跑。'},
 {t:'在旁边和同学打闹，没注意她',d:-6,s:'她跑完的时候，找不到你。'},
 {t:'“三千米？你肯定跑不完。”',d:-7,s:'她一句话没说，跑完了全程。'}

/* ============================================================
   渲染
============================================================ */
function renderStats(){
  const ap=((S.aff+50)/150)*100;
  affFill.style.width=ap+'%';
  affVal.textContent=S.aff;
  if(S.aff<0) affFill.style.background='linear-gradient(90deg,#2a3a5c,#5a7fbf)';
  else affFill.style.background='linear-gradient(90deg,#7a3a5c,#ff7fb5)';

  if(S.loveMode){
    loveRow.style.display='flex';
    const lp=((S.love+10)/110)*100;
    loveFill.style.width=lp+'%';
    loveVal.textContent=S.love;
    if(S.love<0) loveFill.style.background='linear-gradient(90deg,#3a2a4c,#7a5a9c)';
    else loveFill.style.background='linear-gradient(90deg,#5c3a7a,#c07fff)';
  }

  if(!S.loveMode&&S.crush>0){
    crushRow.style.display='flex';
    crushFill.style.width=(S.crush/50*100)+'%';
    crushVal.textContent=S.crush;
  }else{ crushRow.style.display='none'; }

  if(S.cheatMode){
    cheatRow.style.display='flex';
    cheatFill.style.width=(S.cheat/100*100)+'%';
    cheatVal.textContent=S.cheat;
  }else{ cheatRow.style.display='none'; }

  if(S.devMode){
    devRow.style.display='flex';
    devFill.style.width=(S.dev/50*100)+'%';
    devVal.textContent=S.dev;
    corruptRow.style.display='flex';
    corruptFill.style.width=(S.corrupt/50*100)+'%';
    corruptVal.textContent=S.corrupt;
  }else{ devRow.style.display='none'; corruptRow.style.display='none'; }

  const hpP=(S.hp/10)*100;
  hpFill.style.width=hpP+'%';
  hpVal.textContent=S.hp;
  if(S.hp<=3) hpFill.style.background='linear-gradient(90deg,#7a2a2a,#ff5f5f)';
  else if(S.hp<=6) hpFill.style.background='linear-gradient(90deg,#7a6a3a,#ffd45f)';
  else hpFill.style.background='linear-gradient(90deg,#2a7a4c,#5fff9f)';

  let st='同班同学';
  if(S.devMode){
    st='养成中·'+S.devType+'（'+S.dev+'/50）';
    if(S.corrupt>0) st+=' · 堕落 '+S.corrupt;
  }
  else if(S.cheatMode) st='出轨中（事件 '+S.cheatDone+'/10）';
  else if(S.married) st='夫妻';
  else if(S.dating) st='恋人';
  if(!S.loveMode&&!S.cheatMode&&!S.devMode){
    if(S.aff>=80&&!S.dating) st='暧昧不清';
    if(S.aff<0&&S.aff>=-20) st='冷淡';
    if(S.aff<-20) st='憎恨';
  }else if(S.loveMode&&!S.cheatMode&&!S.devMode){
    if(S.love<0) st='分居中';
    else if(S.love>=30) st='恩爱夫妻';
    if(S.love>=80) st='白头偕老（进行中）';
  }
  if(S.breakups>0&&S.dating) st+='（复合第'+S.breakups+'次）';
  if(S.hp<=2) st+='·虚弱';
  statusLine.textContent='状态：'+st;

  if(S.over||S.giftCount>=S.giftTotal||S.cheatMode||S.devMode){
    giftRow.style.display='none';
  }else{
    giftRow.style.display='flex';
    const who=S.loveMode?'爱意值':'好感度';
    giftTopBtn.textContent='🎁 送她礼物（剩 '+(S.giftTotal-S.giftCount)+' 次 · +3 '+who+'）';
  }
}

function clearScene(){
  choicesBox.innerHTML='';
  fbBox.innerHTML='';
  specialBox.innerHTML='';
}

/* ============================================================
   主流程
============================================================ */
function nextTurn(){
  if(S.over) return;
  S.turn++;
  clearScene();

  if(checkEndings()) return;

  if(S.devMode){
    if(S.corrupt<50 && Math.random()<0.35 && S.turn-S.lastCorrupt>=1){
      S.lastCorrupt=S.turn;
      showCorruptEvent();
      return;
    }
    if(S.corruptTriggered>0 && S.suspicionCount<3 && S.turn-S.lastSuspect>=4 && Math.random()<0.4){
      S.lastSuspect=S.turn;
      showSuspicionEvent();
      return;
    }
    showDevEvent();
    return;
  }

  if(S.cheatMode){ showCheatEvent(); return; }

  if(S.dating&&!S.married&&S.aff<80){ doBreakup(); return; }

  if(S.turn-S.lastEnv>=3 && Math.random()<0.24){
    S.lastEnv=S.turn;
    showEvent(pickUnused(ENV_EVENTS,S.usedEnv));
    return;
  }

  if(S.loveMode){
    if(S.love<0&&S.turn%2===1){
      evTitle.textContent='分居的日子';
      evText.textContent='你们住在同一个屋檐下，却像是两个世界的人。\n今天，什么都没有发生。';
      const b=document.createElement('button');
      b.className='btn ghost';b.textContent='继续 ▶';
      b.onclick=nextTurn;
      choicesBox.appendChild(b);
      renderStats();
      return;
    }
    if(S.love>=30&&Math.random()<0.33){
      showEvent(pickUnused(NIGHT_EVENTS,S.usedNight));
      return;
    }
    showEvent(pickUnused(LOVE_EVENTS,S.usedLove));
  }else{
    showEvent(pickUnused(AFF_EVENTS,S.usedAff));
  }
}

function pickUnused(pool,used){
  let avail=pool.filter(e=>!used.includes(e.title));
  if(avail.length===0){used.length=0;avail=pool;}
  const ev=pick(avail);
  used.push(ev.title);
  return ev;
}

function showEvent(ev){
  evTitle.textContent=ev.title;
  evText.textContent=ev.text;
  choicesBox.innerHTML='';
  const opts=shuffle(ev.options);
  opts.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='choice';
    b.textContent=String.fromCharCode(65+i)+'. '+o.t;
    b.onclick=()=>resolve(o,ev);
    choicesBox.appendChild(b);
  });
  renderStats();
  buildSpecial();
}

/* ---------------- 养成事件 ---------------- */
function showDevEvent(){
  const pool=DEV_EVENTS_BY_TYPE[S.devType]||DEV_EVENTS_BY_TYPE['温柔妈妈型'];
  let avail=pool.filter(e=>!S.usedDev.includes(e.title));
  if(avail.length===0){S.usedDev=[];avail=pool;}
  const ev=pick(avail);
  S.usedDev.push(ev.title);

  evTitle.textContent=ev.title;
  evText.textContent=ev.text;
  choicesBox.innerHTML='';

  const opts=shuffle(ev.options);
  opts.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='choice';
    b.textContent=String.fromCharCode(65+i)+'. '+o.t;
    b.onclick=()=>resolveDev(o,ev);
    choicesBox.appendChild(b);
  });

  const note=document.createElement('div');
  note.style.cssText='margin-top:10px;font-size:12px;color:#8d7d98;text-align:center;';
  note.textContent='（养成值：'+S.dev+' / 50　堕落值：'+S.corrupt+' / 50）';
  choicesBox.appendChild(note);

  renderStats();
}

function resolveDev(opt,ev){
  if(S.over) return;
  [...choicesBox.children].forEach(b=>{if(b.tagName==='BUTTON')b.disabled=true;});

  const v=opt.v||5;
  S.dev=clamp(S.dev+v,0,50);

  let html='<div class="feedback">';
  html+=`<span class="delta blue">养成值 +${v}</span>`;
  html+='</div>';
  fbBox.innerHTML=html;

  renderStats();

  if(S.dev>=50&&!S.devDone){
    S.devDone=true;
    const e=DEV_ENDING[S.devType];
    setTimeout(()=>ending(e.title,e.text),300);
    return;
  }

  const cont=document.createElement('button');
  cont.className='btn ghost';
  cont.textContent='继续 ▶';
  cont.style.marginTop='12px';
  cont.onclick=()=>nextTurn();
  fbBox.appendChild(cont);
}

/* ---------------- 堕落事件 ---------------- */
function showCorruptEvent(){
  let avail=CORRUPT_EVENTS.filter(e=>!S.usedCorrupt.includes(e.title));
  if(avail.length===0){S.usedCorrupt=[];avail=CORRUPT_EVENTS;}
  const ev=pick(avail);
  S.usedCorrupt.push(ev.title);

  evTitle.textContent=ev.title;
  evText.textContent=ev.text;
  choicesBox.innerHTML='';

  const opts=shuffle(ev.options);
  opts.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='choice';
    b.textContent=String.fromCharCode(65+i)+'. '+o.t;
    b.onclick=()=>resolveCorrupt(o,ev);
    choicesBox.appendChild(b);
  });

  renderStats();
}

function resolveCorrupt(opt,ev){
  if(S.over) return;
  [...choicesBox.children].forEach(b=>{if(b.tagName==='BUTTON')b.disabled=true;});

  const v=opt.v||5;
  const oldCorrupt=S.corrupt;
  S.corrupt=clamp(S.corrupt+v,0,50);

  const oldTrig=Math.floor(oldCorrupt/12);
  const newTrig=Math.floor(S.corrupt/12);
  const triggerSuspect=(newTrig>oldTrig);
  if(triggerSuspect) S.corruptTriggered++;

  let html='<div class="feedback">';
  html+=`<span class="delta orange">堕落值 +${v}</span>`;
  if(triggerSuspect){
    html+='<br><span style="color:#ff9fc9;font-size:13px;">（杜新宇似乎察觉到了什么……）</span>';
  }
  html+='</div>';
  fbBox.innerHTML=html;

  renderStats();

  if(S.corrupt>=50){ setTimeout(()=>corruptEnding(),300); return; }

  const cont=document.createElement('button');
  cont.className='btn ghost';
  cont.textContent='继续 ▶';
  cont.style.marginTop='12px';
  cont.onclick=()=>{
    if(triggerSuspect&&S.suspicionCount<3){ setTimeout(()=>showSuspicionEvent(),200); }
    else{ nextTurn(); }
  };
  fbBox.appendChild(cont);
}

  const opts=shuffle(ev.options);

/* ---------------- 常规结算 ---------------- */
function resolve(opt,ev){
  if(S.over) return;
  [...choicesBox.children].forEach(b=>b.disabled=true);

  let d=opt.d||0;
  let hp=opt.hp||0;
  let c=opt.c||0;
  let extra='';

  if(d!==0){
    if(!S.loveMode){
      if(d>0&&S.aff<-20){
        d=Math.max(1,Math.round(d/2));
        extra='（她的心防太重，你的善意被打了个折扣……）';
      }
      S.aff=clamp(S.aff+d,-50,100);
    }else{
      S.love=clamp(S.love+d,-10,100);
    }
  }

  if(c!==0&&!S.loveMode){
    S.crush=clamp(S.crush+c,0,50);
  }

  if(hp!==0){
    S.hp=clamp(S.hp+hp,0,10);
  }

  if(opt.s) evText.textContent=opt.s;

  let msg='';
  if(!opt.s){
    if(d>0) msg=S.loveMode?pick(GOOD_LOVE):pick(GOOD_AFF);
    else if(d<0) msg=S.loveMode?pick(BAD_LOVE):pick(BAD_AFF);
    else msg='……';
    if(!S.loveMode&&S.aff<0&&S.aff>=-20&&Math.random()<0.5) msg=pick(COLD_LINE);
    if(!S.loveMode&&S.aff<-20&&Math.random()<0.6) msg=pick(HATE_LINE);
  }

  let html='<div class="feedback">';
  if(msg) html+=msg+'<br>';
  if(d!==0){
    html+=`<span class="delta ${d>0?'up':'down'}">${S.loveMode?'爱意值':'好感度'} ${d>0?'+':''}${d}</span>`;
  }
  if(c!==0&&!S.loveMode){
    if(d!==0) html+='　';
    html+=`<span class="delta gold">暧昧值 +${c}</span>`;
  }
  if(hp!==0){
    if(d!==0||c!==0) html+='　';
    html+=`<span class="delta ${hp>0?'up':'down'}">健康值 ${hp>0?'+':''}${hp}</span>`;
  }
  if(extra){ html+=`<br><span style="color:#9c8aa5;font-size:12.5px;">${extra}</span>`; }
  html+='</div>';
  fbBox.innerHTML=html;

  renderStats();

  if(checkEndings()) return;

  const shouldDate=Math.floor(S.crush/10);
  const dateTriggered = !S.loveMode && !S.cheatMode && !S.devMode && shouldDate>S.crushTriggered && S.crushTriggered<5;
  if(dateTriggered){
    const dateIdx=Math.min(S.crushTriggered,DATE_EVENTS.length-1);
    S.crushTriggered++;

    const hint=document.createElement('div');
    hint.className='feedback';
    hint.style.borderLeftColor='#ffd45f';
    hint.style.marginTop='12px';
    hint.innerHTML='<span style="color:#ffd45f;">✦ 暧昧值达到 '+S.crush+' 点，触发了约会剧情</span>';
    fbBox.appendChild(hint);

    const b=document.createElement('button');
    b.className='btn';
    b.textContent='📅 点击开始约会 ▶';
    b.style.marginTop='12px';
    b.onclick=()=>showDateEvent(dateIdx);
    fbBox.appendChild(b);
    return;
  }

  buildSpecial();

  const triggerBad = (d < 0) && !S.inBadEvent && !S.over && Math.random() < 0.28;

  const cont=document.createElement('button');
  cont.className='btn ghost';
  cont.textContent='继续 ▶';
  cont.style.marginTop='12px';
  cont.onclick=()=>{
    if(S.dating&&!S.married&&S.aff<80){ doBreakup(); return; }
    if(triggerBad){ showBadEvent(); return; }
    nextTurn();
  };
  fbBox.appendChild(cont);
}

/* ============================================================
   送礼小游戏
============================================================ */
const gameOverlay=el('gameOverlay'),gameArea=el('gameArea'),giftBtn=el('giftBtn'),
      gameStatus=el('gameStatus'),gameBtns=el('gameBtns'),gameDesc=el('gameDesc'),gameTitle=el('gameTitle');

let G={active:false,hits:0,target:3,timeLeft:6,timer:null,moveTimer:null};

giftTopBtn.onclick=()=>{
  if(S.over||S.giftCount>=S.giftTotal||S.cheatMode||S.devMode) return;
  gameOverlay.style.display='flex';
  startGiftRound();
};

function startGiftRound(){
  G.active=true; G.hits=0; G.target=3; G.timeLeft=6;
  const who = S.loveMode?'爱意值':'好感度';
  gameTitle.textContent='🎁 送她一份礼物';
  gameDesc.textContent='在 6 秒内点中飘动的礼物 3 次，就能把礼物送出去（+3 '+who+'）。点不中也没关系，可以重试。';
  gameStatus.textContent='时间：6.0 秒　点中：0 / 3';
  gameBtns.innerHTML='';
  giftBtn.style.display='flex';
  moveGift();

  clearInterval(G.timer);
  clearInterval(G.moveTimer);

  G.timer=setInterval(()=>{
    if(!G.active) return;
    G.timeLeft-=0.1;
    if(G.timeLeft<=0){ G.timeLeft=0; updateGameStatus(); endGiftRound(false); return; }
    updateGameStatus();
  },100);

  G.moveTimer=setInterval(()=>{ if(G.active) moveGift(); },900);
}

function updateGameStatus(){
  gameStatus.textContent=`时间：${G.timeLeft.toFixed(1)} 秒　点中：${G.hits} / ${G.target}`;
}

function moveGift(){
  const w=gameArea.clientWidth, h=gameArea.clientHeight;
  const bw=64, bh=64;
  const x=Math.random()*Math.max(1,w-bw-8)+4;
  const y=Math.random()*Math.max(1,h-bh-8)+4;
  giftBtn.style.left=x+'px';
  giftBtn.style.top=y+'px';
}

giftBtn.onclick=(e)=>{
  e.stopPropagation();
  if(!G.active) return;
  G.hits++;
  updateGameStatus();
  moveGift();
  if(G.hits>=G.target) endGiftRound(true);
};

function endGiftRound(success){
  G.active=false;
  clearInterval(G.timer);
  clearInterval(G.moveTimer);
  giftBtn.style.display='none';

  if(success){
    S.giftCount++;
    let d=3;
    if(!S.loveMode){
      S.aff=clamp(S.aff+d,-50,100);
    }else{
      S.love=clamp(S.love+d,-10,100);
    }
    const who=S.loveMode?'爱意值':'好感度';
    gameStatus.innerHTML=`<span style="color:#ffe9a8;">✿ 礼物送到了！${who} +3</span>`;

    let giftLine='';
    if(!S.loveMode){
      giftLine=pick([
        '你把礼物递过去。\n\n杜新宇愣了一下，接过来，慢慢拆开。\n\n“……给我的？”\n\n“嗯。”\n\n她低下头，把礼物抱在怀里，很久没有说话。',
        '她看着那个盒子，手指在包装纸上停顿了一下。\n\n“我……很少收到礼物。”',
        '“送给我的？”\n\n她确认了一遍。\n\n你点头。\n\n她笑了一下，那个笑很短，但你看得很清楚。'
      ]);
    }else{
      giftLine=pick([
        '你把礼物递过去。\n\n杜新宇接过来，笑着说：“你又乱花钱。”\n\n但她拆得很认真。',
        '“今天是什么日子吗？”\n\n“不是。”\n\n“那你为什么送我这个。”\n\n“因为想送。”\n\n她看着你，笑了。',
        '她拆开礼物，眼睛亮了一下。\n\n“……你还记得我喜欢这个。”'
      ]);
    }
    evTitle.textContent='礼物';
    evText.textContent=giftLine;
    renderStats();
    gameBtns.innerHTML='';
    const b=document.createElement('button');
    b.className='btn';b.textContent='收下她的笑容 ▶';
    b.onclick=()=>{
      gameOverlay.style.display='none';
      buildSpecial();
      renderStats();
      fbBox.innerHTML='';
      const cont=document.createElement('button');
      cont.className='btn ghost';cont.textContent='继续 ▶';
      cont.style.marginTop='12px';
      cont.onclick=()=>{
        if(S.dating&&!S.married&&S.aff<80){ doBreakup(); return; }
        nextTurn();
      };
      fbBox.appendChild(cont);
    };
    gameBtns.appendChild(b);
  }else{
    gameStatus.innerHTML='<span style="color:#ff9f9f;">✿ 没能在时间内点中……再试一次吧</span>';
    gameBtns.innerHTML='';
    const retry=document.createElement('button');
    retry.className='btn';retry.textContent='再试一次';
    retry.onclick=startGiftRound;
    gameBtns.appendChild(retry);
    const close=document.createElement('button');
    close.className='btn ghost';close.textContent='算了';
    close.onclick=()=>{
      gameOverlay.style.display='none';
      buildSpecial();
      renderStats();
    };
    gameBtns.appendChild(close);
  }
}

  renderStats();
  const b=document.createElement('button');
  b.className='btn ghost';b.textContent='继续 ▶';
  b.onclick=()=>nextTurn();
  choicesBox.appendChild(b);
}

/* ---------------- 选择养成 ---------------- */
function showDevChoice(){
  clearScene();
  evTitle.textContent='爱意值满';
  evText.textContent='爱意值达到了满值。\n\n杜新宇坐在你身边，握着你的手，眼睛亮亮的。\n\n“陈正言。”\n\n“我们以后，会一直这样吧。”\n\n你看着她。\n\n——现在，你可以选择和她白头到老。\n——也可以选择……重新塑造她。';
  choicesBox.innerHTML='';

  const b1=document.createElement('button');
  b1.className='btn';
  b1.textContent='❤ 和她白头到老';
  b1.onclick=()=>ending('白头到老',
    '很多很多年以后。\n\n杜新宇坐在院子里的藤椅上，头发已经全白了。\n\n“陈正言。”\n\n“嗯？”\n\n“下辈子……你还会来找我吗？”\n\n你握紧了她的手。\n\n“会。每一辈子都会。”\n\n——这一生，你没有辜负她。');
  choicesBox.appendChild(b1);

  const b2=document.createElement('button');
  b2.className='btn ghost';
  b2.textContent='✦ 开启养成系统（重新塑造她）';
  b2.onclick=showDevTypeChoice;
  choicesBox.appendChild(b2);

  renderStats();
}

function showDevTypeChoice(){
  clearScene();
  evTitle.textContent='选择养成方向';
  evText.textContent='你决定重新塑造她。\n\n你想让她成为什么样的人？\n\n（每种类型有专属的养成事件和结局）';
  choicesBox.innerHTML='';

  DEV_TYPES.forEach(t=>{
    const b=document.createElement('button');
    b.className='choice';
    b.textContent='▸ '+t;
    b.onclick=()=>startDevMode(t);
    choicesBox.appendChild(b);
  });

  renderStats();
}

function startDevMode(type){
  S.devMode=true;
  S.devType=type;
  S.dev=0;
  S.corrupt=0;
  S.usedDev=[];
  S.usedCorrupt=[];
  S.usedSuspect=[];
  S.lastCorrupt=S.turn;
  S.lastSuspect=S.turn;
  S.suspicionCount=0;
  S.corruptTriggered=0;

  clearScene();
  evTitle.textContent='养成系统 · '+type;
  evText.textContent=DEV_TYPE_INTRO[type]+'\n\n——但是，你没有注意到，有个人正在暗处看着你们。\n\n他叫晁凡。\n\n他会时不时出现在你身边。';

  const b=document.createElement('button');
  b.className='btn';b.textContent='开始 ▶';
  b.onclick=()=>nextTurn();
  choicesBox.appendChild(b);

  renderStats();
}

/* ---------------- 结局判定 ---------------- */
function checkEndings(){
  if(S.over) return true;

  if(S.hp<=0){
    ending('她的葬礼',
      '医生说，是长期积劳，加上这一次的重感冒。\n\n葬礼那天下着小雨。\n\n你站在人群最后面，看着那张黑白照片。\n\n她的遗物里，有一本《雪国》，一个歪歪扭扭的手工摆件，和一张被撕成两半的签文。\n\n签文上写着：大吉。\n\n“我从来没有跟任何人说过，我其实很怕一个人。”');
    return true;
  }

  if(S.aff<=-50){
    ending('遗书',
      '你推开杜新宇家的门时，房间里很安静。\n\n桌上放着一封信，字迹工整得像是在写作业。\n\n「陈正言：\n\n我从来没有跟任何人说过，我其实很怕一个人。\n\n后来我遇到了你，我以为终于有人愿意留下来了。\n\n原来是我搞错了。\n\n我不恨你。我只是……太累了。\n\n——杜新宇」');
    return true;
  }

  if(S.loveMode&&S.love<=-10&&!S.cheatMode&&!S.devMode){
    S.cheatMode=true;
    S.cheat=0;
    S.cheatDone=0;
    S.cheatTriggered=0;
    S.usedCheat=[];
    clearScene();
    evTitle.textContent='出轨值系统开启';
    evText.textContent='杜新宇的手机在凌晨一点震动。\n\n来电显示：陈俊群。\n\n她看了你一眼，你睡得很沉。\n\n她拿着手机去了阳台。\n\n（出轨值系统已解锁。接下来的 10 个事件，将决定她会不会离开你。）';
    const b=document.createElement('button');
    b.className='btn';b.textContent='继续 ▶';
    b.onclick=()=>nextTurn();
    choicesBox.appendChild(b);
    renderStats();
    return true;
  }

  if(S.loveMode&&S.love>=100&&!S.devMode&&!S.cheatMode&&!S.devDone){
    showDevChoice();
    return true;
  }

  return false;
}

/* ---------------- 结局弹窗 ---------------- */
function ending(title,text){
  S.over=true;
  clearScene();
  el('ovTitle').textContent='—— '+title+' ——';
  el('ovText').textContent=text;
  el('overlay').style.display='flex';
  renderStats();
}

/* ============================================================
   启动
============================================================ */
function start(){
  renderStats();
  evTitle.textContent='序章';
  evText.textContent='私立樱丘学园，新学期第一天。\n\n班主任在黑板上写下座位表——你的名字旁边，写着「杜新宇」。\n\n据说她是这座城市最大的财阀的独生女，据说她从来没有对任何人笑过。\n\n据说，她叫杜新宇。';
  choicesBox.innerHTML='';
  const b=document.createElement('button');
  b.className='btn';b.textContent='开始游戏 ▶';
  b.onclick=()=>{clearScene();nextTurn();};
  choicesBox.appendChild(b);
}
start();
</script>
</body>
</html>
